name: macOS CI

on:
  push:
    paths: ["macos/**", ".github/workflows/macos-ci.yml"]
  pull_request:
    paths: ["macos/**", ".github/workflows/macos-ci.yml"]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: macos-15
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v5
      - name: Select Swift 6 toolchain
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"
      - name: Verify toolchain
        run: |
          xcodebuild -version
          swift --version
          test "$(swift package dump-package | python3 -c 'import json, sys; print(json.load(sys.stdin)["toolsVersion"]["_version"])')" = "6.0.0"
      - name: Build debug
        run: swift build -Xswiftc -strict-concurrency=complete
      - name: Run tests
        id: tests
        run: |
          set +e
          swift test --no-parallel -Xswiftc -strict-concurrency=complete 2>&1 | tee swift-test.log
          exit_code=${PIPESTATUS[0]}
          echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload test diagnostics
        if: steps.tests.outputs.exit_code != '0'
        uses: actions/upload-artifact@v4
        with:
          name: macos-test-diagnostics-${{ github.sha }}
          path: macos/swift-test.log
      - name: Publish test diagnostics
        if: steps.tests.outputs.exit_code != '0'
        run: |
          {
            echo "## macOS Swift test output"
            echo '```text'
            cat swift-test.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail when tests fail
        if: steps.tests.outputs.exit_code != '0'
        run: exit 1
      - name: Build release
        run: swift build -c release
      - name: Check diff whitespace
        run: git diff --check
      - name: Archive release executable
        uses: actions/upload-artifact@v4
        with:
          name: ultron-macos-release-${{ github.sha }}
          path: macos/.build/release/ULTRON
