name: macOS CI

on:
  push:
    paths:
      - "macos/**"
      - ".github/workflows/macos-ci.yml"
  pull_request:
    paths:
      - "macos/**"
      - ".github/workflows/macos-ci.yml"

permissions:
  contents: read

jobs:
  build-test:
    runs-on: macos-15

    defaults:
      run:
        working-directory: macos

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Show Swift Version
        run: swift --version

      - name: Build Debug
        run: swift build

      - name: Run Tests
        run: swift test

      - name: Build Release
        run: swift build -c release

      - name: Check Whitespace
        run: git diff --check

      - name: Upload Release Binary
        uses: actions/upload-artifact@v4
        with:
          name: ultron-macos-release-${{ github.sha }}
          path: macos/.build/release/ULTRON
