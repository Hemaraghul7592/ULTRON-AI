name: macOS CI

on:
  push:
    paths: ["macos/**", ".github/workflows/macos-ci.yml"]
  pull_request:
    paths: ["macos/**", ".github/workflows/macos-ci.yml"]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: macos-14
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v4
      - name: Select Swift 6 toolchain
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.2"
      - name: Verify toolchain
        run: |
          xcodebuild -version
          swift --version
          test "$(swift package dump-package | python3 -c 'import json, sys; print(json.load(sys.stdin)["toolsVersion"]["_version"])')" = "6.0.0"
      - name: Build debug
        run: swift build -Xswiftc -strict-concurrency=complete
      - name: Run tests
        run: swift test --no-parallel -Xswiftc -strict-concurrency=complete
      - name: Build release
        run: swift build -c release
      - name: Check diff whitespace
        run: git diff --check
      - name: Archive release executable
        uses: actions/upload-artifact@v4
        with:
          name: ultron-macos-release-${{ github.sha }}
          path: macos/.build/release/ULTRON
