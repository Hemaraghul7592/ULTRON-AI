name: macOS CI

on:
  push:
    paths: ["macos/**", ".github/workflows/macos-ci.yml"]
  pull_request:
    paths: ["macos/**", ".github/workflows/macos-ci.yml"]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: macos-15
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v5
      - name: Select Swift 6 toolchain
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"
      - name: Verify toolchain
        run: |
          xcodebuild -version
          swift --version
          test "$(swift package dump-package | python3 -c 'import json, sys; print(json.load(sys.stdin)["toolsVersion"]["_version"])')" = "6.0.0"
      - name: Build debug
        run: swift build -Xswiftc -strict-concurrency=complete
      - name: Run tests
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          swift test --no-parallel -Xswiftc -strict-concurrency=complete 2>&1 | tee swift-test.log
      - name: Upload test diagnostics
        if: steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: macos-test-diagnostics-${{ github.sha }}
          path: macos/swift-test.log
      - name: Publish test diagnostics
        if: steps.tests.outcome == 'failure'
        run: |
          {
            echo "## macOS Swift test output"
            echo '```text'
            cat swift-test.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY'
          from pathlib import Path
          for line in Path("swift-test.log").read_text(errors="replace").splitlines():
              lowered = line.lower()
              if "failed" in lowered or "error" in lowered or "issue" in lowered:
                  print(f"::error title=Swift test diagnostic::{line[:1000]}")
          PY
      - name: Fail when tests fail
        if: steps.tests.outcome == 'failure'
        run: exit 1
      - name: Build release
        run: swift build -c release
      - name: Check diff whitespace
        run: git diff --check
      - name: Archive release executable
        uses: actions/upload-artifact@v4
        with:
          name: ultron-macos-release-${{ github.sha }}
          path: macos/.build/release/ULTRON
