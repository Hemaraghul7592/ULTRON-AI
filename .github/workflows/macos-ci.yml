name: macOS CI

on:
  push:
    paths: ["macos/**", ".github/workflows/macos-ci.yml"]
  pull_request:
    paths: ["macos/**", ".github/workflows/macos-ci.yml"]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: macos-14
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v4
      - name: Build debug
        run: swift build -Xswiftc -strict-concurrency=complete
      - name: Run tests
        run: swift test -Xswiftc -strict-concurrency=complete
      - name: Build release
        run: swift build -c release
      - name: Check diff whitespace
        run: git diff --check
      - name: Archive release executable
        uses: actions/upload-artifact@v4
        with:
          name: ultron-macos-release-${{ github.sha }}
          path: macos/.build/release/ULTRON
